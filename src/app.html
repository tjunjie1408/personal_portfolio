<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before paint: marks JS as available, resolves the theme, and decides whether
			// the intro plays (once per browser session, never under reduced motion or on the blog).
			(function () {
				var d = document.documentElement;
				d.classList.add('js');
				var t = null;
				try {
					t = localStorage.getItem('theme');
				} catch (e) {}
				if (t !== 'light' && t !== 'dark') {
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				d.dataset.theme = t;
				var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
				var seen = false;
				try {
					seen = sessionStorage.getItem('intro-seen') === '1';
				} catch (e) {}
				// Someone arriving at a post came to read it: no curtain on the blog.
				var reading = location.pathname.indexOf('/blog') === 0;
				if (!reduce && !seen && !reading) d.dataset.intro = '';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
